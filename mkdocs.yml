site_name: PlateMap Studio
site_description: Desktop plate-map designer for high-content screening and Cell Painting
site_url: https://livr-vub.github.io/Platemap-studio/
repo_url: https://github.com/LIVR-VUB/Platemap-studio
repo_name: LIVR-VUB/Platemap-studio
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 LIVR-VUB · MIT License

exclude_docs: |
  screenshots/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - glightbox:
      zoomable: true
      skip_classes: [no-zoom]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LIVR-VUB/Platemap-studio
    - icon: material/download
      link: https://github.com/LIVR-VUB/Platemap-studio/releases/latest

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Your first plate map: getting-started/first-plate-map.md
      - The interface: getting-started/interface.md
  - User guide:
      - user-guide/index.md
      - Plates & formats: user-guide/plates.md
      - Selecting wells: user-guide/selecting-wells.md
      - Entering values: user-guide/editing-values.md
      - Fields: user-guide/fields.md
      - Units: user-guide/units.md
      - Colors: user-guide/colors.md
      - Layers: user-guide/layers.md
      - Figure style: user-guide/figure-style.md
      - Undo & history: user-guide/history.md
      - Checks: user-guide/checks.md
      - Saving & importing: user-guide/saving-and-importing.md
  - Advanced:
      - advanced/index.md
      - Serial dilution: advanced/serial-dilution.md
      - Distributing controls: advanced/controls.md
      - Randomizing layouts: advanced/randomization.md
      - Replicate plates: advanced/replicate-plates.md
      - 4 × 96 → 384: advanced/384-well.md
      - Auto-fill fields: advanced/auto-fill.md
      - Platemap export (pycytominer): advanced/platemap-export.md
      - Figure export: advanced/figure-export.md
  - Examples:
      - examples/index.md
      - Dose-response in two cell lines: examples/dose-response.md
      - 384-well Cell Painting screen: examples/cell-painting-384.md
      - Seeding density optimisation: examples/seeding-optimisation.md
      - Randomized replicate plates: examples/randomized-replicates.md
      - Cytokines and drugs, mixed units: examples/mixed-units.md
      - Bringing in existing platemaps: examples/existing-platemaps.md
  - Reference:
      - Keyboard shortcuts: reference/shortcuts.md
      - File formats: reference/file-formats.md
      - FAQ & troubleshooting: reference/faq.md
      - Changelog: reference/changelog.md
      - About & license: reference/about.md
